name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libfuse2

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg out/ || true
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi out/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe out/ || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb out/ || true
            cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage out/ || true
          fi
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: kakabin-${{ matrix.name }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kakabin-*
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
